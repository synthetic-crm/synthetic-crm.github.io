<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>QR Code · Brindes Synthetic</title>
<link rel="icon" href="assets/logo-synthetic.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800&family=Barlow:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  body{ margin:0; min-height:100vh; display:grid; place-items:center; font-family:'Barlow',sans-serif; background:#005071; color:#fff; text-align:center; padding:16px; }
  .folha{ background:#fff; color:#0e1b24; border-radius:24px; padding:clamp(16px,3vw,48px); width:min(100%, 720px); box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .logo{ background:#005071; border-radius:14px; padding:12px 20px; display:inline-block; } .logo img{ height:56px; display:block; }
  h1{ font-family:'Roboto Condensed',sans-serif; font-size:clamp(1.8rem,5vw,3rem); color:#005071; margin:.5em 0 .1em; line-height:1.05; }
  p{ font-size:clamp(1rem,2.4vw,1.4rem); margin:.3em 0; }
  #qr{ margin:16px auto; width:min(100%, 480px); } #qr img{ width:100%; height:auto; image-rendering:pixelated; display:block; }
  .url{ font-weight:700; color:#005071; word-break:break-all; }
  button{ font:inherit; font-weight:700; min-height:48px; padding:8px 20px; border-radius:12px; border:2px solid #005071; background:#87dc18; color:#0e1b24; cursor:pointer; margin:6px; }
  @media print{ body{ background:#fff; } .nao-imprime{ display:none; } .folha{ box-shadow:none; } }
</style>
</head>
<body>
<div class="folha">
  <div class="logo"><img src="assets/logo-synthetic.png" alt="Synthetic Lubrificantes Especiais"></div>
  <h1>Escaneie e ganhe seu kit!</h1>
  <p>Aponte a câmera do celular, cadastre-se e retire seu brinde no estande.</p>
  <div id="qr" role="img" aria-label="QR Code para o cadastro do kit de brindes"></div>
  <p class="url" id="url"></p>
  <div class="nao-imprime"><button id="png" type="button">Baixar PNG</button><button onclick="window.print()" type="button">Imprimir</button></div>
</div>
<script>
const LINK = "https://synthetic-crm.github.io/sorteio/";
document.getElementById("url").textContent = LINK;
const q = qrcode(0, "H"); q.addData(LINK); q.make();
const img = document.createElement("img"); img.alt = ""; img.src = q.createDataURL(16, 4); document.getElementById("qr").appendChild(img);
document.getElementById("png").onclick = () => { const a = document.createElement("a"); a.href = img.src; a.download = "qr-brindes-synthetic.png"; document.body.appendChild(a); a.click(); a.remove(); };
</script>
</body>
</html>
