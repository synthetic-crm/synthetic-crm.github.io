<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Balcão de entrega · Synthetic</title>
<link rel="icon" href="assets/logo-synthetic.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800&family=Barlow:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{ --brand:#005071; --ink:#0e1b24; --green:#87dc18; --green-deep:#3f7a00; --red:#c23a2b; --muted:#5f6d78; --line:#dde3e8; }
  *{ box-sizing:border-box; } body{ margin:0; min-height:100vh; font-family:'Barlow',system-ui,sans-serif; font-size:18px; color:var(--ink); background:radial-gradient(120% 90% at 20% 0%, #0a6a93 0%, var(--brand) 45%, #002b3f 100%) fixed; }
  header{ display:flex; align-items:center; gap:12px; padding:10px 16px; flex-wrap:wrap; color:#fff; } header img{ height:44px; } header h1{ font-family:'Roboto Condensed',sans-serif; font-size:1.4rem; margin:0; flex:1; }
  header a,header button{ color:#fff; border:2px solid #fff; background:transparent; border-radius:10px; min-height:44px; padding:6px 14px; font:inherit; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; cursor:pointer; }
  main{ padding:16px; display:grid; justify-items:center; }
  .card{ background:#fff; border-radius:20px; padding:clamp(16px,3vw,40px); width:min(100%, max(560px, 50vw)); box-shadow:0 10px 40px rgba(0,0,0,.3); }
  h2{ font-family:'Roboto Condensed',sans-serif; color:var(--brand); margin:0 0 .4em; font-size:clamp(1.5rem,3vw,2.4rem); }
  input{ font:inherit; font-size:max(20px,1.3rem); width:100%; min-height:64px; padding:10px 14px; border:3px solid var(--line); border-radius:14px; text-transform:uppercase; letter-spacing:.2em; text-align:center; font-weight:800; }
  .btn{ font:inherit; font-family:'Roboto Condensed',sans-serif; font-weight:800; font-size:clamp(1.3rem,2.4vw,2rem); min-height:64px; width:100%; border-radius:14px; border:0; background:var(--green); color:var(--ink); box-shadow:0 5px 0 var(--green-deep); cursor:pointer; margin-top:12px; }
  .btn.sec{ background:#fff; border:2px solid var(--brand); color:var(--brand); box-shadow:none; }
  .btn[disabled]{ opacity:.6; }
  .res{ margin-top:14px; padding:14px; border-radius:14px; background:#eef8df; border:2px solid #cfe9a8; font-size:clamp(1.2rem,2.4vw,1.8rem); }
  .res b{ font-family:'Roboto Condensed',sans-serif; font-size:1.3em; display:block; }
  .res.ja{ background:#fdead0; border-color:#f3cf9c; } .res.nao{ background:#fbe3e0; border-color:#f0c0b9; }
  .msg{ color:var(--red); font-weight:700; min-height:1.4em; } .restam{ margin-top:12px; color:var(--muted); font-size:1.05rem; }
  .oculto{ display:none!important; } form{ display:grid; gap:10px; }
  :focus-visible{ outline:4px solid var(--brand); outline-offset:2px; }
</style>
</head>
<body>
<header><img src="assets/logo-synthetic.png" alt="Synthetic"><h1>Balcão de entrega do kit</h1><a href="admin.html" id="lk-adm" class="oculto">Painel de gestão</a><button id="sair" class="oculto" type="button">Sair</button></header>
<main>
  <section id="login" class="card">
    <h2>Entrar</h2>
    <form id="fl"><input id="em" type="email" placeholder="e-mail do CRM" aria-label="E-mail" autocomplete="username" style="text-transform:none;letter-spacing:0;font-size:1.1rem" required><input id="pw" type="password" placeholder="senha" aria-label="Senha" autocomplete="current-password" style="text-transform:none;letter-spacing:0;font-size:1.1rem" required>
    <button class="btn" type="submit">Entrar</button><div id="lmsg" class="msg" role="alert"></div></form>
    <p style="color:var(--muted)">Use o mesmo login do CRM Synthetic.</p>
  </section>
  <section id="bal" class="card oculto">
    <h2>Código do visitante</h2>
    <form id="fb"><input id="cod" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="_ _ _ _ _" aria-label="Código de retirada com 5 caracteres">
    <button class="btn" type="submit" id="buscar">BUSCAR</button></form>
    <div id="out" role="status" aria-live="polite"></div>
    <div class="restam" id="restam"></div>
  </section>
</main>
<script>
"use strict";
const sb = window.supabase.createClient("https://kszwycktftzpmxzpyvdt.supabase.co", "sb_publishable_vI74WHyJWs2hm-4wlRfVhw__FKP8Vl2", { auth:{ storageKey:"sb-sorteio-admin" } });
const $ = id => document.getElementById(id);
let atual = null;
const el = (t, x, c) => { const e = document.createElement(t); if (x != null) e.textContent = x; if (c) e.className = c; return e; };
async function entrar(){
  const { data:{ session } } = await sb.auth.getSession();
  const on = !!session;
  $("login").classList.toggle("oculto", on); $("bal").classList.toggle("oculto", !on); $("sair").classList.toggle("oculto", !on); $("lk-adm").classList.toggle("oculto", !on);
  if (on){ $("cod").focus(); zera(); }
}
$("fl").onsubmit = async e => { e.preventDefault(); $("lmsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email:$("em").value.trim(), password:$("pw").value }); $("pw").value = "";
  if (error) $("lmsg").textContent = "E-mail ou senha incorretos."; else entrar(); };
$("sair").onclick = async () => { await sb.auth.signOut({ scope:"local" }); entrar(); };
function mostra(cls, titulo, linhas, acao){
  const o = $("out"); o.textContent = ""; const d = el("div", null, "res " + cls); d.appendChild(el("b", titulo)); linhas.forEach(l => d.appendChild(el("div", l))); o.appendChild(d);
  if (acao){ const b = el("button", acao.t, "btn" + (acao.sec ? " sec" : "")); b.type = "button"; b.onclick = acao.f; o.appendChild(b); }
}
$("fb").onsubmit = async e => { e.preventDefault(); atual = null; const c = $("cod").value.trim(); if (c.length < 5){ mostra("nao", "Digite os 5 caracteres do código", []); return; }
  $("buscar").disabled = true;
  const { data, error } = await sb.rpc("sorteio_balcao_buscar", { p_codigo:c }); $("buscar").disabled = false; $("cod").select();
  if (error){ mostra("nao", /negado|42501/.test(error.message + error.code) ? "Sem permissão. Entre com seu login do CRM." : "Falha de conexão. Tente de novo.", []); return; }
  if (data.bloqueado){ mostra("nao", "Muitas tentativas erradas", ["Espere 5 minutos e confira o código com o visitante."]); return; }
  $("restam").textContent = "Kits no estoque físico: " + data.restam;
  if (!data.ok){ mostra("nao", "Código não encontrado", ["Confira o código na tela do visitante."]); return; }
  atual = data; atual.codigo = c.toUpperCase();
  if (data.entregue){ mostra("ja", data.nome, [data.empresa || "", "Kit JÁ ENTREGUE em " + new Date(data.entregue_em).toLocaleString("pt-BR")]); return; }
  mostra("", data.nome, [data.empresa || "", "Kit: boné + caderneta + caneta"].concat(data.restam <= 0 ? ["ATENÇÃO: estoque físico zerado. Confira se há kit na mesa antes de entregar."] : []), { t:"ENTREGAR KIT", f:entregar });
};
async function entregar(){
  if (!atual) return; const { error } = await sb.rpc("sorteio_balcao_entregar", { p_codigo:atual.codigo });
  if (error){ mostra("nao", "Não foi possível registrar. Tente de novo.", []); return; }
  mostra("", "Kit entregue!", [atual.nome], { t:"PRÓXIMO", sec:true, f:() => { $("out").textContent = ""; $("cod").value = ""; $("cod").focus(); $("restam").textContent = ""; } });
  atual = null; setTimeout(() => { if (!atual){ $("out").textContent = ""; $("cod").value = ""; $("cod").focus(); $("restam").textContent = ""; } }, 2500);
}
$("cod").addEventListener("input", e => { e.target.value = e.target.value.replace(/[^A-Za-z0-9]/g, "").toUpperCase(); });
let oc; const zera = () => { clearTimeout(oc); oc = setTimeout(async () => { await sb.auth.signOut({ scope:"local" }); entrar(); }, 30*60*1000); };
["pointerdown","keydown"].forEach(ev => document.addEventListener(ev, () => { if (!$("bal").classList.contains("oculto")) zera(); }, { passive:true }));
entrar();
</script>
</body>
</html>
